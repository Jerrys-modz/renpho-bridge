name: Release

# Push a tag like v0.2.0 to publish a GitHub release with generated notes. The Docker workflow
# runs on the same tag and publishes the matching image tags (0.2.0, 0.2).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Skip if the release was already created in the GitHub UI (which also creates the tag).
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
