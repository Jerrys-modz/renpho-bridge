services:
  sparkyfitness-renpho:
    image: ghcr.io/p1ranha/renpho-bridge:latest
    restart: unless-stopped
    environment:
      TEST_MODE: ${TEST_MODE:-false}
      RENPHO_EMAIL: ${RENPHO_EMAIL:?set RENPHO_EMAIL}
      RENPHO_PASSWORD: ${RENPHO_PASSWORD:?set RENPHO_PASSWORD}
      # Two-letter area stored on the Renpho Health account. A renpho.eu account still uses cloud.renpho.com.
      RENPHO_AREA_CODE: ${RENPHO_AREA_CODE:-US}
      RENPHO_API_URL: ${RENPHO_API_URL:-https://cloud.renpho.com}
      SPARKY_URL: ${SPARKY_URL:-}
      SPARKY_API_KEY: ${SPARKY_API_KEY:-}
      LENGTH_UNIT: ${LENGTH_UNIT:-cm}
      DEBUG: ${DEBUG:-false}
      SYNC_DEVICES: ${SYNC_DEVICES:-scale,tape}
      SCALE_TABLES: ${SCALE_TABLES:-}
      SYNC_RETRIES: ${SYNC_RETRIES:-3}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      SYNC_DAYS: ${SYNC_DAYS:-3}
      FULL_SYNC: ${FULL_SYNC:-false}
      SINCE_DATE: ${SINCE_DATE:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
    volumes:
      - renpho-state:/data

volumes:
  renpho-state:
